<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .box-highlight { fill: #161b22; stroke: #58a6ff; stroke-width: 2; rx: 8px; }
      .title { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; }
      .label { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .subtext { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .code { fill: #79c0ff; font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .badge-green { fill: #238636; }
      .badge-blue { fill: #1f6feb; }
      .badge-purple { fill: #8957e5; }
      .badge-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" />
    </marker>
  </defs>

  <rect width="1000" height="480" class="bg" rx="12" />

  <text x="40" y="45" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">NEXUS-AI: Enterprise 3D WebGL &amp; Telemetry Mesh Architecture</text>
  <text x="40" y="68" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Figma Design Token Governance, High-Craft Three.js 3D Viewport, and Cloudflare Pages Global Edge Ingress</text>

  <!-- Stage 1 -->
  <g transform="translate(40, 100)">
    <rect width="270" height="330" class="box" />
    <rect x="15" y="15" width="70" height="18" rx="4" class="badge-blue" />
    <text x="50" y="27" class="badge-text">STAGE 1</text>
    <text x="15" y="55" class="title">Design Token System</text>
    <text x="15" y="75" class="subtext">Tailwind 4 &amp; Quiet Chrome</text>

    <rect x="15" y="95" width="240" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">Unslop Design Tokens</text>
    <text x="25" y="132" class="subtext">• 4px/8px rhythmic grid spacing</text>
    <text x="25" y="147" class="subtext">• Tinted dark neutrals with one accent</text>

    <rect x="15" y="175" width="240" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="195" class="label">Eliminates AI Slop</text>
    <text x="25" y="212" class="code">zero_glow; zero_gradient_blobs</text>
    <text x="25" y="227" class="subtext">• Purposeful iconography hierarchy</text>

    <rect x="15" y="255" width="240" height="55" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="275" class="label">React 19 Core Component</text>
    <text x="25" y="292" class="subtext">• Zero unnecessary re-renders</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 310 250 L 350 250" class="arrow" />

  <!-- Stage 2 -->
  <g transform="translate(360, 100)">
    <rect width="280" height="330" class="box-highlight" />
    <rect x="15" y="15" width="70" height="18" rx="4" class="badge-purple" />
    <text x="50" y="27" class="badge-text">STAGE 2</text>
    <text x="15" y="55" class="title">3D WebGL Viewport</text>
    <text x="15" y="75" class="subtext">Three.js Kinetic Focal Point</text>

    <rect x="15" y="95" width="250" height="75" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">Interactive Scene Engine</text>
    <text x="25" y="132" class="subtext">• Dynamic lighting and ambient shadows</text>
    <text x="25" y="147" class="subtext">• Mouse-tracked camera parallex</text>

    <rect x="15" y="180" width="250" height="75" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="200" class="label">60 FPS Hardware Bound</text>
    <text x="25" y="218" class="code">draw_calls: &lt; 25 | 60 FPS</text>
    <text x="25" y="235" class="subtext">• Shader optimization with zero lag</text>

    <rect x="15" y="265" width="250" height="45" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="285" class="label">Telemetry Visualizer</text>
    <text x="25" y="298" class="subtext">• Live agentic node state updates</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 640 250 L 680 250" class="arrow" />

  <!-- Stage 3 -->
  <g transform="translate(690, 100)">
    <rect width="270" height="330" class="box" />
    <rect x="15" y="15" width="70" height="18" rx="4" class="badge-green" />
    <text x="50" y="27" class="badge-text">STAGE 3</text>
    <text x="15" y="55" class="title">Cloudflare Edge Ingress</text>
    <text x="15" y="75" class="subtext">Sub-50ms Global Delivery</text>

    <rect x="15" y="95" width="240" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">Vite 8 Static Bundle</text>
    <text x="25" y="132" class="subtext">• Brotli compression &amp; code splitting</text>
    <text x="25" y="147" class="subtext">• Sub-200 KB total JS bundle payload</text>

    <rect x="15" y="175" width="240" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="195" class="label">Cloudflare Pages Hosting</text>
    <text x="25" y="212" class="code">URL: nexus-ai-web.pages.dev</text>
    <text x="25" y="227" class="subtext">• 100% uptime with global edge cache</text>

    <rect x="15" y="255" width="240" height="55" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="275" class="label">Zero Downtime CD</text>
    <text x="25" y="292" class="subtext">• Automated git push deployment</text>
  </g>
</svg>
